spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jobpilot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      timeout: 5000
      host: localhost
      port: 6379
      database: 0

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jobpilot.entity
  configuration:
    map-underscore-to-camel-case: true


file:
  upload-path: E:/jobpilot/uploads/


logging:
  level:
    com.jobpilot.mapper: debug

server:
  port: 8080